# ───────────────────────────────────────────────────────────────
#  Nginx جلوی برنامه می‌ایستد: SSL، فشرده‌سازی، محدودکردن تلاش ورود،
#  و سِرو کردن فایل‌های ثابت بدون درگیر کردن Node.
#
#  این فایل عمداً فقط پورت ۸۰ دارد. بعد از اجرای certbot، خودِ certbot
#  یک بلوک ۴۴۳ با همین تنظیمات می‌سازد و این یکی را به ریدایرکت https
#  تبدیل می‌کند. دستی بلوک SSL ننویس — کار certbot را خراب می‌کند.
#
#  نصب:
#    sudo sed "s/DOMAIN/دامنه‌ات/g" deploy/nginx.conf > /etc/nginx/sites-available/sharzad
#    sudo ln -sf /etc/nginx/sites-available/sharzad /etc/nginx/sites-enabled/
#    sudo rm -f /etc/nginx/sites-enabled/default
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d دامنه‌ات -d www.دامنه‌ات --redirect
# ───────────────────────────────────────────────────────────────

# محدودکردن تلاش ورود — جلوی حدس‌زدن رمز پنل و درخواست پشت‌سرهم کد پیامکی.
#
# فقط POST شمرده می‌شود، نه GET. چرا: وقتی نشست منقضی شود، Next همه‌ی لینک‌های
# منوی پنل را با هم prefetch می‌کند، هر کدام به /admin/login ریدایرکت می‌شوند و
# در یک ثانیه ۱۵ تا GET می‌خورَد به این محدودیت — نتیجه‌اش ۵۰۳ و صفحه‌ی سفید
# برای کاربرِ بی‌گناه بود (روی سرور واقعی همین اتفاق افتاد). حدس‌زدن رمز و
# درخواست کد پیامکی هر دو POST هستند، پس چیزی از امنیت کم نمی‌شود.
# کلیدِ خالی یعنی nginx آن درخواست را اصلاً نمی‌شمارد.
map $request_method $sharzad_login_key {
    default "";
    POST    $binary_remote_addr;
}

limit_req_zone $sharzad_login_key zone=sharzad_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=sharzad_all:10m rate=120r/m;

upstream sharzad_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    # LISTEN_IPV6  ← اگر سرور IPv6 داشته باشد، setup-server.sh اینجا را پر می‌کند.
    # روی سروری که IPv6 ندارد، وجود این خط باعث می‌شود nginx اصلاً بالا نیاید.
    server_name DOMAIN www.DOMAIN;

    charset utf-8;
    client_max_body_size 12M;   # عکس پرونده تا ۵ مگ؛ با حاشیه

    access_log /var/log/nginx/sharzad.access.log;
    error_log  /var/log/nginx/sharzad.error.log;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ─── سرآیندهای امنیتی ───
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    limit_req zone=sharzad_all burst=60 nodelay;

    # ─── فایل‌های ساخته‌شده‌ی Next تغییرناپذیرند، پس تا ابد کش ───
    location /_next/static/ {
        alias /var/www/sharzad/.next/static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ─── ورود به پنل و کد پیامکی: سخت‌گیرانه‌تر ───
    location = /admin/login {
        limit_req zone=sharzad_login burst=5 nodelay;
        proxy_pass http://sharzad_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /login {
        limit_req zone=sharzad_login burst=5 nodelay;
        proxy_pass http://sharzad_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── پنل مدیریت هیچ‌وقت نباید در گوگل بیفتد ───
    location /admin/ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://sharzad_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://sharzad_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
